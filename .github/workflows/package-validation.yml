name: Package lifecycle and UI validation
on:
  workflow_dispatch:
    inputs:
      image:
        type: choice
        default: all
        options: [all, 'ubuntu:24.04', 'fedora:44', 'almalinux:10']
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.image == 'all' && '["ubuntu:24.04","fedora:44","almalinux:10"]' || format('["{0}"]', inputs.image)) }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false
      - name: Build, install, exercise, update, uninstall, and reinstall
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p validation-output
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD:/input:ro" -v "$PWD/validation-output:/output" "$TEST_IMAGE" bash -lc '
            set -euo pipefail
            if command -v apt-get >/dev/null; then
              sed -i "s|http://archive.ubuntu.com|https://archive.ubuntu.com|g; s|http://security.ubuntu.com|https://security.ubuntu.com|g" /etc/apt/sources.list.d/ubuntu.sources
              apt-get update
              apt-get install -y cmake ninja-build g++ qt6-base-dev libpipewire-0.3-dev pkg-config curl procps xvfb xauth
            else
              # Desktop audio needs systemd. The minimal Fedora container ships
              # mutually exclusive standalone tmpfiles; replace only that fixture.
              dnf install -y --allowerasing systemd
              dnf install -y cmake ninja-build gcc-c++ qt6-qtbase-devel pipewire-devel pkgconf-pkg-config rpm-build tar gzip curl procps-ng
            fi
            cp -a /input /work
            cd /work
            if command -v apt-get >/dev/null; then ./scripts/build-deb.sh 2>&1 | tee /output/build.log; else ./scripts/build-rpm.sh 2>&1 | tee /output/build.log; fi
            bash tests/linux_package_lifecycle.sh /output
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-validation-${{ strategy.job-index }}
          path: validation-output/
