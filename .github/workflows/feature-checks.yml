name: Linux and Windows feature checks

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'data/**', 'scripts/**', 'packaging/**', 'CMakeLists.txt', 'THIRD-PARTY-NOTICES.md', '.github/workflows/**']
  # Required branch checks must also run for documentation-only PRs.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          # The runner's Azure HTTP mirror can exhaust the job while fetching Qt.
          # Use the canonical HTTPS mirror and bound stalled download attempts.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake ninja-build g++ qt6-base-dev xvfb xauth
      - name: Build shared desktop and DSP
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Check DSP and shared controls
        run: ctest --test-dir build --output-on-failure
      - name: Check actual X11 editing menus and platform-theme buttons
        run: QT_QPA_PLATFORM=xcb xvfb-run -a timeout 30s ./build/soundcurrent-localization-test
      - name: Check small X11 desktop with larger fonts
        run: QT_QPA_PLATFORM=xcb SOUNDCURRENT_TEST_FONT_SCALE=1.5 xvfb-run -a -s '-screen 0 800x600x24' timeout 60s ./build/soundcurrent-eq --ui-self-test
  windows:
    uses: ./.github/workflows/windows-check.yml
