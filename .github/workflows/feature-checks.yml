name: Linux and Windows feature checks

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'data/**', 'scripts/**', 'packaging/**', 'CMakeLists.txt', 'THIRD-PARTY-NOTICES.md', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'tests/**', 'data/**', 'scripts/**', 'packaging/**', 'CMakeLists.txt', 'THIRD-PARTY-NOTICES.md', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev
      - name: Build shared desktop and DSP
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel 2
      - name: Check DSP and shared controls
        run: ctest --test-dir build --output-on-failure
  windows:
    uses: ./.github/workflows/windows-check.yml
