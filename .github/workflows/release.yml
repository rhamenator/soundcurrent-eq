name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev
      - name: Build package
        run: ./scripts/build-deb.sh
      - name: Check DSP and shared UI
        run: ctest --test-dir build --output-on-failure
      - name: Build and check Fedora 44 RPM
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:44 bash -lc '
            set -euo pipefail
            dnf install -y cmake gcc-c++ qt6-qtbase-devel rpm-build tar gzip
            ./scripts/build-rpm.sh
            dnf install -y --allowerasing dist/x86_64/*fc44*.rpm
            QT_QPA_PLATFORM=offscreen /usr/bin/soundcurrent-eq --ui-self-test
          '
      - name: Build and check RHEL 10 compatible RPM
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:10 bash -lc '
            set -euo pipefail
            dnf install -y cmake gcc-c++ qt6-qtbase-devel rpm-build tar gzip
            ./scripts/build-rpm.sh
            dnf install -y --allowerasing dist/x86_64/*el10*.rpm
            QT_QPA_PLATFORM=offscreen /usr/bin/soundcurrent-eq --ui-self-test
          '
      - name: Verify package checksums
        run: |
          for checksum in dist/*.sha256 dist/x86_64/*.sha256; do
            (cd "$(dirname "$checksum")" && sha256sum -c "$(basename "$checksum")")
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.sha256
            dist/x86_64/*.rpm
            dist/x86_64/*.sha256
  windows:
    uses: ./.github/workflows/windows-check.yml
    permissions:
      contents: read
  publish:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' assets < <(find packages -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.sha256' -o -name 'qtbase*.tar.xz' \) -print0)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "SoundCurrent EQ $GITHUB_REF_NAME" --generate-notes
