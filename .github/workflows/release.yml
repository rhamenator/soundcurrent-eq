name: Release Linux packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev
      - name: Build package
        run: ./scripts/build-deb.sh
      - name: Build and check Fedora 44 RPM
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:44 bash -lc '
            set -euo pipefail
            dnf install -y cmake gcc-c++ qt6-qtbase-devel rpm-build tar gzip
            ./scripts/build-rpm.sh
            dnf install -y dist/x86_64/*fc44*.rpm
            QT_QPA_PLATFORM=offscreen /usr/bin/soundcurrent-eq --ui-self-test
          '
      - name: Build and check RHEL 10 compatible RPM
        run: |
          docker run --rm -v "$PWD:/src" -w /src almalinux:10 bash -lc '
            set -euo pipefail
            dnf install -y cmake gcc-c++ qt6-qtbase-devel rpm-build tar gzip
            ./scripts/build-rpm.sh
            dnf install -y dist/x86_64/*el10*.rpm
            QT_QPA_PLATFORM=offscreen /usr/bin/soundcurrent-eq --ui-self-test
          '
      - name: Verify package checksums
        run: |
          for checksum in dist/*.sha256 dist/x86_64/*.sha256; do
            (cd "$(dirname "$checksum")" && sha256sum -c "$(basename "$checksum")")
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256 dist/x86_64/*.rpm dist/x86_64/*.sha256 --title "SoundCurrent EQ $GITHUB_REF_NAME" --generate-notes
