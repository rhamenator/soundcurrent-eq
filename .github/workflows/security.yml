name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-policy-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce release and privileged-driver security contracts
        run: |
          python3 tests/security_policy.py
          python3 tests/windows_variant_parity.py
      - name: Scan Git history for credentials
        uses: trufflesecurity/trufflehog@f8221ca52ac51bf66228d6ec3691f3ea0782ae15 # main at 2026-11-07
        with:
          version: 3.99.8
          extra_args: --results=verified,unknown

  codeql-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.3
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev
      - name: Build shared C++ application and tests
        run: cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build-codeql --parallel 2
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:c-cpp/platform:linux

  codeql-windows-driver-manager:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.3
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build the privileged driver manager only
        shell: pwsh
        run: |
          cmake -S native/windows/driver-manager -B build-driver-manager -A x64
          cmake --build build-driver-manager --config Release --parallel 2
          python tests/security_policy.py
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:c-cpp/platform:windows-driver-manager
